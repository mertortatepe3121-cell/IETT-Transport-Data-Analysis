<!DOCTYPE html>
<html lang="tr">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>İETT Veri Analiz Sistemi | Şifre Yenileme</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
    >

    <!-- Ana CSS -->
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

</head>


<body>

    <!-- Arka Plan -->
    <div class="background-overlay"></div>


    <!-- Şifre Yenileme -->
    <div class="login-container">

        <div class="glass-card">


            <!-- Logo -->

            <div class="logo-area">

                <img
                    src="{{ url_for('static', filename='img/iett-logo.png') }}"
                    alt="İETT Logo"
                    class="logo"
                >

                <h2>İETT</h2>

                <p>Şifre Yenileme</p>

            </div>


            <!-- Başarı Mesajı -->

            {% if success %}

                <div class="forgot-success">

                    <i class="fa-solid fa-circle-check"></i>

                    <span>
                        {{ success }}
                    </span>

                </div>

            {% endif %}


            <!-- Hata Mesajı -->

            {% if error %}

                <div class="forgot-error">

                    <i class="fa-solid fa-circle-exclamation"></i>

                    <span>
                        {{ error }}
                    </span>

                </div>

            {% endif %}


            <!-- Form -->

            {% if not success %}

            <form
                method="POST"
                action="{{ url_for('sifremi_unuttum') }}"
            >


                <!-- Kullanıcı Adı -->

                <div class="input-box">

                    <i class="fa-solid fa-user"></i>

                    <input
                        type="text"
                        name="username"
                        placeholder="Kullanıcı Adı"
                        value="{{ username or '' }}"
                        required
                    >

                </div>


                <!-- Yeni Şifre -->

                <div class="input-box">

                    <i class="fa-solid fa-lock"></i>

                    <input
                        type="password"
                        name="new_password"
                        placeholder="Yeni Şifre"
                        required
                    >

                </div>


                <!-- Yeni Şifre Tekrar -->

                <div class="input-box">

                    <i class="fa-solid fa-lock"></i>

                    <input
                        type="password"
                        name="confirm_password"
                        placeholder="Yeni Şifre Tekrar"
                        required
                    >

                </div>


                <!-- Buton -->

                <button
                    type="submit"
                    class="login-btn"
                >

                    <i class="fa-solid fa-key"></i>

                    Şifreyi Güncelle

                </button>

            </form>

            {% endif %}


            <!-- Login'e Dön -->

            <div class="back-login">

                <a href="{{ url_for('login') }}">

                    <i class="fa-solid fa-arrow-left"></i>

                    Giriş Ekranına Dön

                </a>

            </div>


            <!-- Footer -->

            <div class="footer">

                © 2026 İETT Veri Analiz Sistemi

            </div>


        </div>

    </div>


</body>

</html>
