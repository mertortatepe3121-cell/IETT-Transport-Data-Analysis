<!DOCTYPE html>
<html lang="tr">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>İETT Veri Analiz Sistemi | Giriş</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

    <!-- Arka Plan -->
    <div class="background-overlay"></div>

    <!-- Login -->
    <div class="login-container">

        <div class="glass-card">

            <!-- Logo -->

            <div class="logo-area">

                <img src="{{ url_for('static', filename='img/iett-logo.png') }}"
                    alt="İETT Logo"
                    class="logo">

                <h2>İETT</h2>

<p>Veri Analiz Sistemi</p>

<div class="welcome-text">

    <strong>Hoş Geldiniz</strong>

    <span>Lütfen hesabınıza giriş yapın.</span>

</div>

            </div>

            <!-- Form -->

            <form id="loginForm" method="POST">

                {% if error %}
<div class="alert alert-danger">
    {{ error }}
</div>
{% endif %}



                <!-- Kullanıcı -->

                <div class="input-box">

                    <i class="fa-solid fa-user"></i>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Kullanıcı Adı"
                        required>

                </div>

                <!-- Şifre -->

                <div class="input-box">

                    <i class="fa-solid fa-lock"></i>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Şifre"
                        required>

                    

                </div>

                <!-- Alt -->

                <div class="options">

   <a href="{{ url_for('sifremi_unuttum') }}">
    Şifremi Unuttum?
</a>

</div>

                <!-- Buton -->

                <button
                    type="submit"
                    class="login-btn">

                    <i class="fa-solid fa-right-to-bracket"></i>

                    Giriş Yap

                </button>

            </form>

            <!-- Footer -->

            <div class="footer">

                © 2026 İETT Veri Analiz Sistemi

            </div>

        </div>

    </div>

    <!-- JS -->

    <script src="{{ url_for('static', filename='js/login.js') }}"></script>

</body>

</html>
